<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>迷宫</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="layout">
        <main class="stage" role="application" aria-label="Maze game">
          <canvas id="mazeCanvas"></canvas>
          <div id="toast" class="toast" aria-live="polite"></div>
        </main>

        <aside class="side" aria-label="Controls">
          <header class="top">
            <div class="logo" aria-label="CC">CC</div>
            <div class="badge" aria-label="Level">
              <span id="levelDots" class="dots" aria-hidden="true"></span>
            </div>
            <div class="topBtns">
              <button id="btnNew" class="iconBtn" type="button" aria-label="New">
                <span class="btnIcon" aria-hidden="true">↻</span>
                <span class="btnLabel" aria-hidden="true">chóngxīn</span>
              </button>
            </div>
          </header>

          <section class="panel" aria-label="Settings">
            <div class="row">
              <label class="rowTitle" for="rememberToggle" aria-hidden="true">
                <span class="rowIcon">🔖</span>
                <span class="rowText">jìzhù</span>
              </label>
              <label class="switch">
                <input id="rememberToggle" type="checkbox" aria-label="Remember level" />
                <span class="slider" aria-hidden="true"></span>
              </label>
            </div>

            <div class="row">
              <label class="rowTitle" for="hintToggle" aria-hidden="true">
                <span class="rowIcon">✨</span>
                <span class="rowText">tíshì</span>
              </label>
              <label class="switch">
                <input id="hintToggle" type="checkbox" aria-label="Hint path" />
                <span class="slider" aria-hidden="true"></span>
              </label>
            </div>

            <div class="difficulty" aria-label="Difficulty">
              <button class="chip" type="button" data-tier="1" aria-label="Difficulty 1">
                <span class="chipIcon" aria-hidden="true">♡</span>
                <span class="chipLabel" aria-hidden="true">jiǎndān</span>
              </button>
              <button class="chip" type="button" data-tier="2" aria-label="Difficulty 2">
                <span class="chipIcon" aria-hidden="true">♡♡</span>
                <span class="chipLabel" aria-hidden="true">róngyì</span>
              </button>
              <button class="chip" type="button" data-tier="3" aria-label="Difficulty 3">
                <span class="chipIcon" aria-hidden="true">♡♡♡</span>
                <span class="chipLabel" aria-hidden="true">yībān</span>
              </button>
              <button class="chip" type="button" data-tier="4" aria-label="Difficulty 4">
                <span class="chipIcon" aria-hidden="true">♡♡♡♡</span>
                <span class="chipLabel" aria-hidden="true">kùnnán</span>
              </button>
              <button class="chip" type="button" data-tier="5" aria-label="Difficulty 5">
                <span class="chipIcon" aria-hidden="true">♡♡♡♡♡</span>
                <span class="chipLabel" aria-hidden="true">chāonán</span>
              </button>
            </div>
          </section>

          <div class="pad">
            <button class="padBtn" type="button" data-move="up" aria-label="Up">
              <span class="btnIcon" aria-hidden="true">▲</span>
              <span class="btnLabel" aria-hidden="true">shàng</span>
            </button>
            <div class="padRow">
              <button class="padBtn" type="button" data-move="left" aria-label="Left">
                <span class="btnIcon" aria-hidden="true">◀</span>
                <span class="btnLabel" aria-hidden="true">zuǒ</span>
              </button>
              <button class="padBtn big" type="button" data-move="down" aria-label="Down">
                <span class="btnIcon" aria-hidden="true">▼</span>
                <span class="btnLabel" aria-hidden="true">xià</span>
              </button>
              <button class="padBtn" type="button" data-move="right" aria-label="Right">
                <span class="btnIcon" aria-hidden="true">▶</span>
                <span class="btnLabel" aria-hidden="true">yòu</span>
              </button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
